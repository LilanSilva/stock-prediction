# RabbitMQ configuration for Feed Analyzer.
# Declaratively load the topic exchange, queues, DLX and bindings at broker start.
# The definitions file is rendered at startup by render-definitions.sh, which injects the broker
# user (with a hash computed from RABBITMQ_DEFAULT_PASS) so no secret is stored in a tracked file.
management.load_definitions = /var/lib/rabbitmq/rendered-definitions.json

log.console = true
log.console.level = info
