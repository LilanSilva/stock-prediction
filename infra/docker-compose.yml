# Feed Analyzer local development stack.
#
# Topology follows the frozen contracts, not the legacy per-service-database draft:
#   - ONE PostgreSQL database (feed) with service-owned schemas (see infra/postgres).
#   - Neo4j for the causal knowledge graph only.
#   - RabbitMQ with the durable topic exchange `feed.events` (see infra/rabbitmq).
#
# Copy .env.example to .env and fill in secrets before running:
#   docker compose -f infra/docker-compose.yml up -d

services:
  feed-postgres:
    # The community `pgvector/pgvector` image is blocked by org registry policy, so we build a
    # local image from the allowed official `postgres:16` base with pgvector installed.
    build:
      context: ./postgres-image
    image: feed-analyzer/postgres-pgvector:16
    container_name: feed-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-feed_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-feed}
    ports:
      - "5432:5432"
    volumes:
      # Init scripts run in alphabetical order on first start (empty data volume).
      - ./postgres/:/docker-entrypoint-initdb.d/:ro
      - feed-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-feed_user} -d ${POSTGRES_DB:-feed}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - feed-net

  feed-neo4j:
    image: neo4j:5.20-community
    container_name: feed-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:?NEO4J_AUTH must be set in .env}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./neo4j/init/:/seed/:ro
      - feed-neo4j-data:/data
      - feed-neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 8
      start_period: 20s
    networks:
      - feed-net

  # Neo4j does not auto-run Cypher on start, so a one-shot init container seeds it
  # once Neo4j is healthy. Idempotent via MERGE, so re-runs are safe.
  feed-neo4j-seed:
    image: neo4j:5.20-community
    container_name: feed-neo4j-seed
    restart: "no"
    depends_on:
      feed-neo4j:
        condition: service_healthy
    environment:
      NEO4J_SEED_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in .env}
    volumes:
      - ./neo4j/init/:/seed/:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        for f in /seed/*.cypher; do
          echo "Running $$f";
          cypher-shell -a bolt://feed-neo4j:7687 -u neo4j -p "$$NEO4J_SEED_PASSWORD" --file "$$f";
        done
        echo "Neo4j seed complete";
    networks:
      - feed-net

  feed-rabbitmq:
    image: rabbitmq:3.13-management
    container_name: feed-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-feed_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS must be set in .env}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/render-definitions.sh:/usr/local/bin/render-definitions.sh:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - feed-rabbitmq-data:/var/lib/rabbitmq
    # Render the definitions (injecting the broker user + permissions from env, hashing the password
    # at runtime) before starting the broker. `tr -d` guards against CRLF line endings on Windows.
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        tr -d '\r' < /usr/local/bin/render-definitions.sh > /tmp/render-definitions.sh
        bash /tmp/render-definitions.sh
        exec docker-entrypoint.sh rabbitmq-server
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - feed-net

  feed-ingestion:
    build:
      context: ..
      dockerfile: src/services/ingestion/Dockerfile
    image: feed-analyzer/ingestion:0.1
    container_name: feed-ingestion
    depends_on:
      feed-postgres:
        condition: service_healthy
      feed-rabbitmq:
        condition: service_healthy
    environment:
      # Container-network connection strings (override the host-side values in .env). The service
      # reaches Postgres/RabbitMQ by their compose service names, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-feed_user}:${POSTGRES_PASSWORD:?set in .env}@feed-postgres:5432/${POSTGRES_DB:-feed}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-feed_user}:${RABBITMQ_DEFAULT_PASS:?set in .env}@feed-rabbitmq:5672/
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Editable asset registry (mounted read-only below): add companies/markets without
      # a rebuild. Falls back to the wheel-packaged assets.json when unset.
      ASSET_REGISTRY_PATH: /config/assets.json
      POLL_INTERVAL_SECONDS: ${INGESTION_POLL_INTERVAL_SECONDS:-3600}
      # FreeNewsApi.io key (POC-8, replaces GDELT). Empty disables the source; RSS feeds still run.
      FREENEWSAPI_KEY: ${FREENEWSAPI_KEY:-}
      # Articles fetched per keyword search per poll (kept small so bodies fetch quickly).
      FREENEWSAPI_PAGE_SIZE: ${FREENEWSAPI_PAGE_SIZE:-5}
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - feed-net
    volumes:
      - ./assets/:/config/:ro

  feed-cleansing:
    build:
      context: ..
      dockerfile: src/services/cleansing/Dockerfile.ml
    image: feed-analyzer/cleansing:0.1-ml
    container_name: feed-cleansing
    depends_on:
      feed-postgres:
        condition: service_healthy
      feed-rabbitmq:
        condition: service_healthy
    environment:
      # Container-network connection strings (override the host-side values in .env). The service
      # reaches Postgres/RabbitMQ by their compose service names, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-feed_user}:${POSTGRES_PASSWORD:?set in .env}@feed-postgres:5432/${POSTGRES_DB:-feed}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-feed_user}:${RABBITMQ_DEFAULT_PASS:?set in .env}@feed-rabbitmq:5672/
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Editable asset registry (mounted read-only below): add companies/markets without
      # a rebuild. Falls back to the wheel-packaged assets.json when unset.
      ASSET_REGISTRY_PATH: /config/assets.json
      # Full-spec ML backends (baked into Dockerfile.ml): BGE-m3 embeddings + spaCy extraction.
      CLEANSING_EMBEDDING_BACKEND: ${CLEANSING_EMBEDDING_BACKEND:-bge-m3}
      CLEANSING_NLP_BACKEND: ${CLEANSING_NLP_BACKEND:-spacy}
      # Event-time cluster-close tuning; a cluster closes after this quiet gap with no new members.
      CLEANSING_QUIET_PERIOD_MINUTES: ${CLEANSING_QUIET_PERIOD_MINUTES:-30}
      # LLM-assisted merge is optional; when unset the service runs local-only.
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 8
      # Loading BGE-m3 (~2 GB) into memory at startup takes time; allow a generous grace period.
      start_period: 240s
    # BGE-m3 (torch) is memory-resident; reserve enough RAM and cap it so a runaway cannot starve the host.
    mem_reservation: 2g
    mem_limit: 4g
    networks:
      - feed-net
    volumes:
      - ./assets/:/config/:ro

  feed-prediction:
    build:
      context: ..
      dockerfile: src/services/prediction/Dockerfile
    image: feed-analyzer/prediction:0.1
    container_name: feed-prediction
    depends_on:
      feed-postgres:
        condition: service_healthy
      feed-rabbitmq:
        condition: service_healthy
      feed-neo4j:
        condition: service_healthy
      feed-neo4j-seed:
        condition: service_completed_successfully
    environment:
      # Container-network connection strings (override the host-side values in .env). The service
      # reaches Postgres/RabbitMQ/Neo4j by their compose service names, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-feed_user}:${POSTGRES_PASSWORD:?set in .env}@feed-postgres:5432/${POSTGRES_DB:-feed}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-feed_user}:${RABBITMQ_DEFAULT_PASS:?set in .env}@feed-rabbitmq:5672/
      NEO4J_URI: bolt://feed-neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Editable asset registry (mounted read-only below): add companies/markets without
      # a rebuild. Falls back to the wheel-packaged assets.json when unset.
      ASSET_REGISTRY_PATH: /config/assets.json
    ports:
      - "8003:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - feed-net
    volumes:
      - ./assets/:/config/:ro

  feed-market-data:
    build:
      context: ..
      dockerfile: src/services/market-data/Dockerfile
    image: feed-analyzer/market-data:0.1
    container_name: feed-market-data
    depends_on:
      feed-postgres:
        condition: service_healthy
      feed-rabbitmq:
        condition: service_healthy
    environment:
      # Container-network connection strings (override the host-side values in .env). The service
      # reaches Postgres/RabbitMQ by their compose service names, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-feed_user}:${POSTGRES_PASSWORD:?set in .env}@feed-postgres:5432/${POSTGRES_DB:-feed}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-feed_user}:${RABBITMQ_DEFAULT_PASS:?set in .env}@feed-rabbitmq:5672/
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Editable asset registry (mounted read-only below): add companies/markets without
      # a rebuild. Falls back to the wheel-packaged assets.json when unset.
      ASSET_REGISTRY_PATH: /config/assets.json
      # How often to re-drive pending requests whose settlement session has not yet completed.
      SETTLEMENT_POLL_INTERVAL_SECONDS: ${MARKET_DATA_SETTLEMENT_POLL_INTERVAL_SECONDS:-3600}
    ports:
      - "8004:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - feed-net
    volumes:
      - ./assets/:/config/:ro

  feed-verification:
    build:
      context: ..
      dockerfile: src/services/verification/Dockerfile
    image: feed-analyzer/verification:0.1
    container_name: feed-verification
    depends_on:
      feed-postgres:
        condition: service_healthy
      feed-rabbitmq:
        condition: service_healthy
    environment:
      # Container-network connection strings (override the host-side values in .env). The service
      # reaches Postgres/RabbitMQ by their compose service names, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-feed_user}:${POSTGRES_PASSWORD:?set in .env}@feed-postgres:5432/${POSTGRES_DB:-feed}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-feed_user}:${RABBITMQ_DEFAULT_PASS:?set in .env}@feed-rabbitmq:5672/
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Editable asset registry (mounted read-only below): add companies/markets without
      # a rebuild. Falls back to the wheel-packaged assets.json when unset.
      ASSET_REGISTRY_PATH: /config/assets.json
    ports:
      - "8006:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - feed-net
    volumes:
      - ./assets/:/config/:ro

  feed-credibility:
    build:
      context: ..
      dockerfile: src/services/credibility/Dockerfile
    image: feed-analyzer/credibility:0.1
    container_name: feed-credibility
    depends_on:
      feed-postgres:
        condition: service_healthy
      feed-rabbitmq:
        condition: service_healthy
      feed-neo4j:
        condition: service_healthy
      feed-neo4j-seed:
        condition: service_completed_successfully
    environment:
      # Container-network connection strings (override the host-side values in .env). The service
      # reaches Postgres/RabbitMQ/Neo4j by their compose service names, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-feed_user}:${POSTGRES_PASSWORD:?set in .env}@feed-postgres:5432/${POSTGRES_DB:-feed}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-feed_user}:${RABBITMQ_DEFAULT_PASS:?set in .env}@feed-rabbitmq:5672/
      NEO4J_URI: bolt://feed-neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Editable asset registry (mounted read-only below): add companies/markets without
      # a rebuild. Falls back to the wheel-packaged assets.json when unset.
      ASSET_REGISTRY_PATH: /config/assets.json
    ports:
      - "8007:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - feed-net
    volumes:
      - ./assets/:/config/:ro

  feed-notification:
    build:
      context: ..
      dockerfile: src/services/notification/Dockerfile
    image: feed-analyzer/notification:0.1
    container_name: feed-notification
    depends_on:
      feed-rabbitmq:
        condition: service_healthy
      feed-postgres:
        condition: service_healthy
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-feed_user}:${RABBITMQ_DEFAULT_PASS:?set in .env}@feed-rabbitmq:5672/
      DATABASE_URL: postgresql://${POSTGRES_USER:-feed_user}:${POSTGRES_PASSWORD:?set in .env}@feed-postgres:5432/${POSTGRES_DB:-feed}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Editable asset registry (mounted read-only below): add companies/markets without
      # a rebuild. Falls back to the wheel-packaged assets.json when unset.
      ASSET_REGISTRY_PATH: /config/assets.json
      # Confidence gate: predictions below this value are silently discarded.
      NOTIFICATION_MIN_CONFIDENCE: ${NOTIFICATION_MIN_CONFIDENCE:-0.6}
      # Brevo email channel — leave empty to disable.
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-Feed Analyzer}
      # Meta Cloud API WhatsApp channel — leave empty to disable.
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID:-}
    ports:
      - "8010:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - feed-net
    volumes:
      - ./assets/:/config/:ro
      - ../src/services/notification/config/recipients/:/app/config/recipients/:ro

volumes:
  feed-postgres-data:
  feed-neo4j-data:
  feed-neo4j-logs:
  feed-rabbitmq-data:

networks:
  feed-net:
    name: feed-net
    driver: bridge
