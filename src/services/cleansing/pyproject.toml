[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feed-analyzer-cleansing"
version = "0.1.0"
description = "Feed Analyzer Cleansing Service: dedup, multilingual embeddings/NLP, conservative dual-gate clustering, and LLM-assisted event merge into EventDetected."
requires-python = ">=3.12"
# The shared library (feed-analyzer-shared) is installed editable into the same root .venv and is
# intentionally NOT listed here so pip does not try to resolve it from PyPI.
dependencies = [
    "aio-pika>=9,<10",
    "asyncpg>=0.29,<1",
    "fastapi>=0.110,<1",
    "uvicorn>=0.30,<1",
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
# Heavy multilingual ML backends. Optional so unit tests and the deterministic default backends
# run without downloading multi-GB models. Selected at runtime via CLEANSING_EMBEDDING_BACKEND /
# CLEANSING_NLP_BACKEND.
ml = [
    "sentence-transformers>=3,<4",
    "spacy>=3.7,<4",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cleansing*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that require live infrastructure or network access",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
# Resolve the sibling editable `shared` package's types from source.
mypy_path = "../../shared"

[[tool.mypy.overrides]]
module = ["asyncpg", "apscheduler.*", "sentence_transformers", "spacy", "spacy.*"]
ignore_missing_imports = true
