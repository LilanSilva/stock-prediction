[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-browser-gateway"
version = "0.1.0"
description = "Local OpenAI-compatible gateway for existing Chrome LLM sessions"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111,<1", "uvicorn>=0.30,<1", "wsproto>=1.2,<2",
  "asyncpg>=0.29,<1", "pydantic>=2.7,<3", "pydantic-settings>=2.3,<3",
  "jsonschema>=4.22,<5",
]

[project.scripts]
llm-browser-gateway = "llm_browser_gateway.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10", "types-jsonschema>=4.22"]

[tool.setuptools.packages.find]
include = ["llm_browser_gateway*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
  "integration: needs an explicitly configured disposable PostgreSQL database",
  "live_browser: explicitly opted-in synthetic requests through the paired real browsers",
]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/../../shared"
[[tool.mypy.overrides]]
module = ["asyncpg"]
ignore_missing_imports = true
