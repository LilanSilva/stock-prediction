[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feed-analyzer-notification"
version = "0.1.0"
description = "Feed Analyzer Notification Service: confidence-gated prediction alerts via email (Brevo) and WhatsApp (Meta Cloud API)."
requires-python = ">=3.12"
# The shared library (feed-analyzer-shared) is installed editable into the same root .venv and is
# intentionally NOT listed here so pip does not try to resolve it from PyPI.
dependencies = [
    "aio-pika>=9,<10",
    "fastapi>=0.110,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["notification*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that require live infrastructure (RabbitMQ)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
mypy_path = "../../shared"

[[tool.mypy.overrides]]
module = ["asyncpg", "apscheduler.*"]
ignore_missing_imports = true
