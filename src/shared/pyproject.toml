[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feed-analyzer-shared"
version = "0.1.0"
description = "Shared library for Feed Analyzer services: canonical message schemas, messaging client, LLM gateway, logging."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "aio-pika>=9.4,<10",
    "jsonschema>=4.22,<5",
    "structlog>=24.1,<25",
    "fastapi>=0.111,<1",
    "starlette>=0.37,<1",
]

[project.optional-dependencies]
llm = [
    "openai>=1.30,<2",
    "anthropic>=0.30,<1",
]
graph = [
    "neo4j>=5,<6",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-jsonschema>=4.22",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*"]

# The JSON asset registry must ship inside the wheel: it is the packaged default that services fall
# back to when ASSET_REGISTRY_PATH is not set. Without this, `pip install` drops the file and every
# service fails at startup on a missing registry.
[tool.setuptools.package-data]
"shared.reference" = ["assets.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that require live infrastructure (RabbitMQ, provider keys)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

# Optional provider SDKs (the `llm` extra) are not required for a base install or for the strict
# type check; ignore their missing stubs rather than forcing every consumer to install them.
[[tool.mypy.overrides]]
module = ["openai", "openai.*", "anthropic", "anthropic.*"]
ignore_missing_imports = true

# The Neo4j driver (the `graph` extra) is optional in the same way: only Prediction and Credibility
# install it, so its stubs are ignored for the base strict check.
[[tool.mypy.overrides]]
module = ["neo4j", "neo4j.*"]
ignore_missing_imports = true
